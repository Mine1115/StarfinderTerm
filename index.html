<!DOCTYPE html>
<html>
    <head>
        <title>user termanal</title>
        <link rel="stylesheet" href="assets/css/homescreen.css">
    </head>
    <body>
        <div id="notifactationBar">
            <img id="batterylevelimg" class="barRight">
            <p id="batterylevel" class="barRight"></p>
        </div>
        <div id="homescreen">
            <div>
                <button class="apps" onclick="openapp('Aspis Database');">
                    <img src="assets/icons/Database.png">
                </button><br>
                <p class="appname">Aspis Database</p>
            </div>
        </div>
        <div id="appscreen">
            <p>app screen</p>
        </div>
        <div id="navagation">
            <button onclick="homebutton();">o</button>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
        <script>
            if (!window.location.href.startsWith("https://mine1115.github.io")) {
                eruda.init();
            }
        </script>
        <script>
            async function openapp(appname) {
                const homescreen = document.getElementById("homescreen")
                const appscreen = document.getElementById("appscreen")
                homescreen.style.display = 'none';
                appscreen.style.display = 'initial';
                if (appname == "Aspis Database") {
                    appscreen.innerHTML = ''
                    try {
                        await fetch("/AspisDatabase.html")
                        .then((response) => {
                            if (!response.ok) {
                                appscreen.innerHTML = `server not ok. status: ${response.status}`
                            }
                            return response.text();
                        })
                        .then((text) => {
                            appscreen.innerHTML = text
                        })
                        
                    } catch (error) {
                        appscreen.innerHTML = `error occured <br>error: ${error.message}`
                    }
                }
            }
            function homebutton() {
                const homescreen = document.getElementById("homescreen")
                const appscreen = document.getElementById("appscreen")
                homescreen.style.display = 'flex';
                appscreen.style.display = 'none';
            }
            async function updateNotifactionBar() {
                const bar = document.getElementById("notifactationBar");

                //battery
                const batteryleveltext = document.getElementById("batterylevel");
                const batterylevelimg = document.getElementById("batterylevelimg");
                if (!('getBattery' in navigator)) { 
                    console.log("unsuported")
                } else {
                    try { 
                        const battery = await navigator.getBattery();
                        // Real battery data 
                        /*console.log({ 
                                supported: true, 
                                blocked: false, 
                                level: Math.floor(battery.level * 100), 
                                charging: battery.charging, 
                                chargingTime: battery.chargingTime, 
                                dischargingTime: battery.dischargingTime 
                            });*/
                        batteryleveltext.textContent = `${Math.round(battery.level*100)}%`
                        if (Math.round(battery.level*100)>92) { //0
                            batterylevelimg.src = "/assets/icons/batterys/battery-0.png"
                        } else if (Math.round(battery.level*100)>93) { //1
                            batterylevelimg.src = "/assets/icons/batterys/battery-1.png"
                        } else if (Math.round(battery.level*100)>86) { //2
                            batterylevelimg.src = "/assets/icons/batterys/battery-2.png"
                        } else if (Math.round(battery.level*100)>79) { //3
                            batterylevelimg.src = "/assets/icons/batterys/battery-3.png"
                        } else if (Math.round(battery.level*100)>72) { //4
                            batterylevelimg.src = "/assets/icons/batterys/battery-4.png"
                        } else if (Math.round(battery.level*100)>65) { //5
                            batterylevelimg.src = "/assets/icons/batterys/battery-5.png"
                        } else if (Math.round(battery.level*100)>58) { //6
                            batterylevelimg.src = "/assets/icons/batterys/battery-6.png"
                        } else if (Math.round(battery.level*100)>51) { //7
                            batterylevelimg.src = "/assets/icons/batterys/battery-7.png"
                        } else if (Math.round(battery.level*100)>44) { //8
                            batterylevelimg.src = "/assets/icons/batterys/battery-8.png"
                        } else if (Math.round(battery.level*100)>37) { //9
                            batterylevelimg.src = "/assets/icons/batterys/battery-9.png"
                        } else if (Math.round(battery.level*100)>30) { //10
                            batterylevelimg.src = "/assets/icons/batterys/battery-10.png"
                        } else if (Math.round(battery.level*100)>23) { //11
                            batterylevelimg.src = "/assets/icons/batterys/battery-11.png"
                        } else if (Math.round(battery.level*100)<23) { //12
                            batterylevelimg.src = "/assets/icons/batterys/battery-12.png"
                        }
                    } catch (error) { 
                    console.log(error)
                    }
                }
            }
            updateNotifactionBar();
        </script>
    </body>
</html>
